model = "gpt-5.6-sol"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
model_reasoning_effort = "high"
# Equivalent to `codex --yolo`: no sandbox and no approval prompts.
approval_policy = "never"
sandbox_mode = "danger-full-access"
service_tier = "fast"
web_search = "live"

[projects."/Users/declanelias"]
trust_level = "trusted"

[projects."/Users/declanelias/mag/monorepo"]
trust_level = "trusted"

[projects."/Users/declanelias/knowledge"]
trust_level = "trusted"

[agent]
dangerously_bypass_approvals_and_sandbox = true
ask_for_approval = "never"

[tui]
vim_mode_default = true
status_line = ["model-with-reasoning", "current-dir", "reasoning", "context-used"]
status_line_use_colors = true

[tui.keymap.chat]
interrupt_turn = "f12"
